[project]
name = "backend"
version = "0.1.0"
description = "Backend API"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "annotated-doc>=0.0.5",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "bleach>=6.4.0",
    "cachetools<8",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "rich<16",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.52.4",
    "websockets<18",
]

[tool.setuptools]
packages = ["models", "routers", "scrapers", "services", "migrations"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["EXAMPLES.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402"]  # E501: line too long (handled by formatter); E402: module-level import order (intentional in seeds/tests)

[tool.ruff.lint.isort]
known-first-party = ["models", "routers", "scrapers", "services", "migrations"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pandas>=3.1.0",
    "matplotlib>=3.11.1",
    "ruff>=0.17.3",
]
