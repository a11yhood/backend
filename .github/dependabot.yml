version: 2
updates:
  # Python direct dependencies in pyproject.toml (regular updates)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
      day: "monday"
      time: "03:00"
    allow:
      - dependency-type: "direct"
    groups:
      python-direct-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps:"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 2

  # Python direct dependency security updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
    allow:
      - dependency-type: "direct"
    groups:
      python-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps:"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 2

  # uv.lock updates (often transitive); keep these in one grouped PR (regular updates)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
      day: "monday"
      time: "03:30"
    groups:
      uv-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps:"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 2

  # uv security updates
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:45"
    groups:
      uv-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps:"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 2

  # GitHub Actions (regular updates)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      github-actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 3

  # GitHub Actions security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:50"
    groups:
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    reviewers:
      - "a11yhood/maintainers"
    open-pull-requests-limit: 3
