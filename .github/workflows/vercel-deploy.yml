name: Deploy to Vercel Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Work out version and commit
        id: build
        run: |
          # Tag runs report the release (v0.6.1 -> 0.6.1); manual runs from a branch report dev-<sha>.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (production)
        # --env sets runtime variables for this deployment; /health reports them.
        run: >-
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          --env APP_VERSION=${{ steps.build.outputs.version }}
          --env GIT_SHA=${{ github.sha }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
